<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperspectral scanner</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; max-width: 720px; }
  fieldset { margin-bottom: 16px; }
  label { display: inline-block; min-width: 110px; }
  input, select { margin: 4px 0; }
  #status, #result, #motor, #scan { white-space: pre-wrap; font-family: monospace; background: #f3f3f3; padding: 8px; }
  td { padding: 2px 8px; }
</style>
</head>
<body>
<h1>Hyperspectral scanner</h1>
<p>Viewfinder, hyperspectral scans, single raw frames and the scan motor.</p>

<fieldset>
  <legend>Viewfinder (USB webcam)</legend>
  <div id="vfwrap" style="position:relative; display:inline-block; max-width:100%">
    <img id="vf" alt="webcam viewfinder" style="display:block; max-width:100%">
    <div id="bandTop" style="position:absolute; left:0; right:0; border-top:2px solid red"></div>
    <div id="bandBottom" style="position:absolute; left:0; right:0; border-top:2px solid red"></div>
    <div id="target" style="position:absolute; display:none; border:2px solid red; border-radius:50%; box-sizing:border-box"></div>
  </div>
  <div><button id="webcamTest">Test line grab</button> <span id="webcamInfo"></span></div>
  <div><button id="setOffset">Set target offset</button> <span id="calInfo"></span></div>
</fieldset>

<fieldset>
  <legend>Scan</legend>
  <label for="scanAngle">Sweep (°)</label> <input id="scanAngle" type="number" value="90" min="1" max="90"><br>
  <label for="scanExposure">Exposure (µs)</label> <input id="scanExposure" type="number" value="66666" min="100" max="1000000"><br>
  <label for="scanComment">Comment</label> <input id="scanComment" type="text" size="40"><br>
  <button id="scanStart">Start scan</button> <button id="scanCancel">Cancel</button>
  <progress id="scanProgress" value="0" max="1" style="width:100%"></progress>
  <div id="scan">idle</div>
</fieldset>

<fieldset>
  <legend>Capture raw frame</legend>
  <label for="exposure">Exposure (µs)</label> <input id="exposure" type="number" value="66666" min="100" max="1000000"><br>
  <label for="gain">Analogue gain</label> <input id="gain" type="number" value="1.0" step="0.1" min="1" max="22"><br>
  <label for="pattern">Test pattern</label>
  <select id="pattern">
    <option value="0">Off (real image)</option>
    <option value="2">Colour bars</option>
    <option value="3">Grey bars</option>
    <option value="1">Solid colour</option>
    <option value="4">PN9 noise</option>
  </select><br>
  <label for="comment">Comment</label> <input id="comment" type="text" size="40"><br>
  <button id="capture">Capture</button>
  <div id="result"></div>
</fieldset>

<fieldset>
  <legend>Scan motor</legend>
  <button id="calibrate">Calibrate</button>
  <label for="angle">Angle (°)</label> <input id="angle" type="number" value="0" step="0.1" min="-90" max="90">
  <button id="move">Move</button>
  <button id="motorSleep">Sleep</button>
  <div id="motor">loading…</div>
</fieldset>

<fieldset>
  <legend>Status</legend>
  <div id="status">loading…</div>
</fieldset>

<fieldset>
  <legend>Files on the SD card</legend>
  <table id="files"></table>
</fieldset>

<script>
async function refreshStatus() {
  try {
    const r = await fetch('/api/status');
    document.getElementById('status').textContent = JSON.stringify(await r.json(), null, 1);
  } catch (e) { document.getElementById('status').textContent = 'unreachable'; }
}
async function refreshFiles() {
  const r = await fetch('/api/files');
  const files = (await r.json()).sort((a, b) => b.name.localeCompare(a.name));
  const t = document.getElementById('files');
  t.innerHTML = '';
  for (const f of files) {
    const row = t.insertRow();
    const a = document.createElement('a');
    a.href = '/files/' + encodeURIComponent(f.name);
    a.textContent = f.name;
    row.insertCell().appendChild(a);
    row.insertCell().textContent = (f.bytes / 1048576).toFixed(2) + ' MB';
  }
}
document.getElementById('capture').onclick = async () => {
  const b = document.getElementById('capture');
  const out = document.getElementById('result');
  b.disabled = true;
  out.textContent = 'capturing…';
  const q = new URLSearchParams({
    exposure: document.getElementById('exposure').value,
    gain: document.getElementById('gain').value,
    pattern: document.getElementById('pattern').value,
    comment: document.getElementById('comment').value,
  });
  try {
    const r = await fetch('/api/capture?' + q);
    out.textContent = JSON.stringify(await r.json(), null, 1);
  } catch (e) { out.textContent = 'capture failed: ' + e; }
  b.disabled = false;
  refreshFiles();
};
async function refreshMotor() {
  try {
    const r = await fetch('/api/motor/status');
    document.getElementById('motor').textContent = JSON.stringify(await r.json(), null, 1);
  } catch (e) { document.getElementById('motor').textContent = 'unreachable'; }
}
async function motorPost(path) {
  const r = await fetch(path, {method: 'POST'});
  if (!r.ok) alert((await r.json()).error);
  refreshMotor();
}
document.getElementById('calibrate').onclick = () => motorPost('/api/motor/calibrate');
document.getElementById('move').onclick = () =>
  motorPost('/api/motor/move?angle=' + encodeURIComponent(document.getElementById('angle').value));
document.getElementById('motorSleep').onclick = () => motorPost('/api/motor/sleep');
setInterval(refreshMotor, 1000);
refreshMotor();
let band = null;
let cal = null;
let pickingOffset = false;
function placeBand() {
  const img = document.getElementById('vf');
  if (!band || !img.naturalHeight) return;
  const k = img.clientHeight / img.naturalHeight;
  document.getElementById('bandTop').style.top = (band[0] * k) + 'px';
  document.getElementById('bandBottom').style.top = (band[1] * k) + 'px';
  const t = document.getElementById('target');
  if (cal && cal.loaded && cal.target.center[0] >= 0) {
    // Same as the Pi viewfinder: target centre plus the webcam offset, in webcam pixels.
    const r = Math.max(cal.target.radius, 5) * k;
    const x = (cal.target.center[0] + cal.webcam_offset[0]) * k;
    const y = (cal.target.center[1] + cal.webcam_offset[1]) * k;
    Object.assign(t.style, {display: 'block', left: (x - r) + 'px', top: (y - r) + 'px',
                            width: (2 * r) + 'px', height: (2 * r) + 'px'});
  } else {
    t.style.display = 'none';
  }
}
function showCal() {
  document.getElementById('calInfo').textContent = cal.loaded
    ? `calibration ${cal.source}, offset ${cal.webcam_offset.join(', ')}`
    : 'no calibration.json on the SD card (using built-in window and band)';
  document.getElementById('setOffset').disabled = !cal.loaded;
}
async function loadCalibration() {
  const r = await fetch('/api/calibration');
  cal = await r.json();
  showCal();
  placeBand();
}
document.getElementById('setOffset').onclick = () => {
  pickingOffset = true;
  document.getElementById('calInfo').textContent = 'click the viewfinder where the HQ camera target really is';
};
document.getElementById('vf').onclick = async (ev) => {
  if (!pickingOffset) return;
  pickingOffset = false;
  const img = ev.target;
  const k = img.naturalWidth / img.clientWidth;
  const col = Math.round(ev.offsetX * k), row = Math.round(ev.offsetY * k);
  const r = await fetch(`/api/calibration/offset?col=${col}&row=${row}`, {method: 'POST'});
  const j = await r.json();
  if (j.error) {
    document.getElementById('calInfo').textContent = j.error;
  } else {
    cal = j;
    showCal();
    placeBand();
  }
};
loadCalibration();
async function startViewfinder() {
  const r = await fetch('/api/webcam/status');
  const w = await r.json();
  band = [w.band_top, w.band_bottom];
  document.getElementById('webcamInfo').textContent =
    w.connected ? `${w.width}x${w.height} at ${w.fps} fps` : 'no webcam connected';
  const img = document.getElementById('vf');
  img.onload = placeBand;
  img.src = `${location.protocol}//${location.hostname}:${w.stream_port}/webcam`;
}
window.addEventListener('resize', placeBand);
setInterval(placeBand, 1000);
document.getElementById('webcamTest').onclick = async () => {
  const r = await fetch('/api/webcam/test');
  document.getElementById('webcamInfo').textContent = JSON.stringify(await r.json());
};
startViewfinder();
let lastScanState = '';
async function refreshScan() {
  try {
    const r = await fetch('/api/scan/status');
    const st = await r.json();
    const p = document.getElementById('scanProgress');
    p.max = Math.max(st.frames_expected, 1);
    p.value = st.frames;
    document.getElementById('scan').textContent = JSON.stringify(st, null, 1);
    if (st.state !== lastScanState && ['done', 'failed', 'cancelled'].includes(st.state)) refreshFiles();
    lastScanState = st.state;
  } catch (e) { document.getElementById('scan').textContent = 'unreachable'; }
}
document.getElementById('scanStart').onclick = async () => {
  const q = new URLSearchParams({
    angle: document.getElementById('scanAngle').value,
    exposure: document.getElementById('scanExposure').value,
    comment: document.getElementById('scanComment').value,
  });
  const r = await fetch('/api/scan/start?' + q, {method: 'POST'});
  if (!r.ok) alert((await r.json()).error);
  refreshScan();
};
document.getElementById('scanCancel').onclick = () => fetch('/api/scan/cancel', {method: 'POST'}).then(refreshScan);
setInterval(refreshScan, 1000);
refreshScan();
// Give the scanner the browser's clock (needed when it runs as an access point).
fetch('/api/time?epoch_ms=' + Date.now(), {method: 'POST'}).finally(refreshStatus);
refreshFiles();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
